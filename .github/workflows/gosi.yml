name: 토지이음 고시 수집
on:
  schedule:
    - cron: "0 3 10,20,29 * *"   # 매월 10·20·29일 12:00(한국) — 월간 파일이 올라오는 날이 달마다 달라 세 번 확인
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python fetch_gosi.py
      - run: |
          git config user.name "gosi-bot"
          git config user.email "gosi-bot@users.noreply.github.com"
          git add gosi.json
          git diff --cached --quiet || git commit -m "고시 갱신 $(date +%F)"
          git push
